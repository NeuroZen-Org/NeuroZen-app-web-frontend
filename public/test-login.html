<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NeuroZen - Login for Testing</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }
        .logo {
            font-size: 2rem;
            font-weight: 900;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 30px;
        }
        .btn {
            display: inline-block;
            padding: 15px 30px;
            margin: 10px;
            border: none;
            border-radius: 25px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }
        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(0,0,0,0.15);
        }
        .btn.secondary {
            background: #e9ecef;
            color: #495057;
        }
        .status {
            margin: 20px 0;
            padding: 15px;
            border-radius: 10px;
            font-size: 14px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">NeuroZen</div>
        <h2>Test Login</h2>
        <p>Para probar el dashboard, necesitas hacer login primero:</p>
        
        <div id="status"></div>
        
        <button class="btn" onclick="loginDemoUser()">Login Usuario Demo</button>
        <button class="btn secondary" onclick="checkLoginStatus()">Verificar Estado</button>
        <button class="btn secondary" onclick="logout()">Logout</button>
        
        <div style="margin-top: 30px;">
            <a href="/" class="btn">Ir al Dashboard</a>
        </div>
        
        <div style="margin-top: 20px; font-size: 12px; color: #6c757d;">
            <p>Credenciales de prueba guardadas en localStorage</p>
        </div>
    </div>

    <script>
        function loginDemoUser() {
            const demoUser = {
                id: "2",
                name: "Usuario Demo",
                email: "demo@neurozen.com",
                role: "user"
            };
            
            localStorage.setItem('user', JSON.stringify(demoUser));
            localStorage.setItem('authToken', 'demo-token-456');
            
            showStatus('Login exitoso! Puedes ir al dashboard.', 'success');
            console.log('Demo user logged in:', demoUser);
        }
        
        function checkLoginStatus() {
            const user = localStorage.getItem('user');
            const token = localStorage.getItem('authToken');
            
            if (user && token) {
                const userData = JSON.parse(user);
                showStatus(`Logueado como: ${userData.name} (${userData.email})`, 'success');
            } else {
                showStatus('No hay usuario logueado.', 'info');
            }
        }
        
        function logout() {
            localStorage.removeItem('user');
            localStorage.removeItem('authToken');
            showStatus('Logout exitoso.', 'info');
        }
        
        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.className = `status ${type}`;
            statusDiv.textContent = message;
        }
        
        // Check status on load
        window.addEventListener('load', checkLoginStatus);
    </script>
</body>
</html>
